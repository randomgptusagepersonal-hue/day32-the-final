<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>The Little Shop of Us · In Your Corner💜✨</title>
<meta name="theme-color" content="#231A3F">
<link rel="preload" href="fraunces.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="caveat.woff2" as="font" type="font/woff2" crossorigin>
<style>
@font-face{font-family:'Fraunces';src:url(fraunces.woff2) format('woff2');font-weight:100 900;font-display:swap}
@font-face{font-family:'Fraunces';src:url(fraunces-italic.woff2) format('woff2');font-weight:100 900;font-style:italic;font-display:swap}
@font-face{font-family:'Caveat';src:url(caveat.woff2) format('woff2');font-weight:400 700;font-display:swap}
@font-face{font-family:'Nunito';src:url(nunito.woff2) format('woff2');font-weight:200 900;font-display:swap}
:root{
  --emoji:'Apple Color Emoji','Segoe UI Emoji','Noto Color Emoji';
  --serif:'Fraunces',Georgia,serif,var(--emoji);--hand:'Caveat','Segoe Script',cursive,var(--emoji);--ui:'Nunito','Segoe UI',system-ui,sans-serif,var(--emoji);
  --u:1vh;--night:#1E1638;--deep:#2E2358;--lav:#C9B2FF;--soft:#E9DCFF;--gold:#FFE1A0;--ink:#3B2C55;
}
@supports (height:1svh){:root{--u:1svh}}
*{box-sizing:border-box}
html,body{height:100%}
html{background:var(--night);-webkit-text-size-adjust:100%}
body{margin:0;overflow:hidden;color:#F4EEFF;font:400 17px/1.45 var(--ui)}
[hidden]{display:none!important}
h1,h2,h3,p{margin:0;font:inherit}
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
img{display:block;max-width:100%}
:focus-visible{outline:2.500px solid var(--gold);outline-offset:3px;border-radius:6px}
.hand{font-family:var(--hand)}
#dust{position:fixed;inset:0;z-index:40;pointer-events:none}

/* ---------- 1. the door ---------- */
#open{position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:clamp(8px,2vh,18px);padding:24px 20px;background:radial-gradient(ellipse 70% 50% at 50% 60%,#3A2B6B,#1E1638 70%);text-align:center;transition:opacity 1.200s ease}
#open.gone{opacity:0;pointer-events:none}
#wisp{position:absolute;width:10px;height:10px;border-radius:50%;background:#FFF3D0;box-shadow:0 0 18px 8px rgba(255,230,170,.7),0 0 40px 18px rgba(201,178,255,.35);animation:wisp 9s ease-in-out infinite;pointer-events:none}
@keyframes wisp{0%{left:-5%;top:70%}30%{left:30%;top:30%}55%{left:62%;top:55%}80%{left:85%;top:22%}100%{left:105%;top:40%}}
.odate{font:500 12.500px/1.2 var(--ui);letter-spacing:.32em;color:#C9B2FF}
.ofinal{font:italic 400 clamp(30px,8vw,46px)/1.05 var(--serif);color:#F4EEFF}
.oline{font:600 clamp(20px,5.200vw,25px)/1.25 var(--hand);color:#E9DCFF}
.ofade{opacity:0;translate:0 8px;transition:opacity 1.200s ease,translate 1.200s ease}
.ofade.on{opacity:1;translate:0 0}
#door{position:relative;width:min(46vw,210px,30vh);aspect-ratio:3/5;margin-top:8px;padding:0;border:0;background:none;perspective:900px}
#door .light{position:absolute;inset:4% 6% 0;border-radius:50% 50% 0 0/30% 30% 0 0;background:radial-gradient(ellipse at 50% 60%,#FFF6DA,#FFD898 40%,#C9A0FF 100%)}
#door .leaf{position:absolute;inset:0;transform-origin:8% 50%;transition:transform 1.600s cubic-bezier(.45,.05,.2,1);transform-style:preserve-3d}
#door .leaf svg{display:block;width:100%;height:100%}
#door.opening .leaf{transform:rotateY(-108deg)}
#door .frame{position:absolute;inset:-6% -9% -1%;border-radius:50% 50% 0 0/30% 30% 0 0;border:6px solid #4E3D80;box-shadow:0 0 0 2px #8B70D6,0 0 40px rgba(201,178,255,.45),inset 0 0 20px rgba(201,178,255,.3);pointer-events:none}
#door::after{content:'';position:absolute;inset:-30%;background:radial-gradient(closest-side,rgba(255,230,170,.0),transparent);transition:background 1.400s ease;pointer-events:none}
#door.opening::after{background:radial-gradient(closest-side,rgba(255,226,170,.55),rgba(201,178,255,.18) 60%,transparent)}
.ohint{font:600 18px/1 var(--hand);color:#BFA8F0;animation:breathe 2.600s ease-in-out infinite}
@keyframes breathe{50%{opacity:.45}}
#flood{position:fixed;inset:0;z-index:55;background:radial-gradient(circle at 50% 60%,#FFF4D6,#E3D3FF 45%,#C9B2FF);opacity:0;pointer-events:none;transition:opacity 1.100s ease}
#flood.on{opacity:1}
#pw{display:flex;gap:8px;margin-top:6px}
#pw input{width:190px;height:44px;padding:0 12px;border:1.500px solid #8B70D6;border-radius:10px;background:rgba(255,255,255,.08);color:#fff;font:500 16px var(--ui);outline:0}
#pwMsg{min-height:20px;font:600 18px/1.1 var(--hand);color:#FFD2E2}

/* ---------- 2. the shop ---------- */
#shop{position:fixed;inset:0;z-index:10;overflow-x:auto;overflow-y:hidden;overscroll-behavior:contain;scrollbar-width:none;background:#C9B8EC;-webkit-overflow-scrolling:touch}
#shop::-webkit-scrollbar{display:none}
#pano{position:relative;width:calc(var(--u)*320);height:calc(var(--u)*100)}
#pano>svg{position:absolute;inset:0;width:100%;height:100%}
.at{position:absolute;left:calc(var(--u)*var(--x));top:calc(var(--u)*var(--y));width:calc(var(--u)*var(--w));height:calc(var(--u)*var(--h))}
.tw{transform-box:fill-box;transform-origin:center;animation:tw 3.200s ease-in-out infinite}
@keyframes tw{50%{opacity:.35;transform:scale(.7)}}
.bulb{animation:bulb 2.800s ease-in-out infinite}
@keyframes bulb{50%{opacity:.45}}
.halo{animation:halo 4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes halo{50%{opacity:.6;transform:scale(.92)}}
.flick{transform-box:fill-box;transform-origin:50% 100%;animation:flick .9s ease-in-out infinite alternate}
@keyframes flick{to{transform:scale(.9,1.1) rotate(2deg)}}
.bub{animation:bub 2.700s ease-in infinite}
@keyframes bub{0%{transform:translateY(0);opacity:0}20%{opacity:.9}100%{transform:translateY(-7px);opacity:0}}
.sway{animation:sway 6s ease-in-out infinite alternate}
@keyframes sway{from{rotate:-3deg}to{rotate:3deg}}
.floaty{animation:floaty 6s ease-in-out infinite alternate}
@keyframes floaty{to{transform:translateY(-2px) rotate(3deg)}}
.rain{animation:rain 1.600s linear infinite}
@keyframes rain{from{transform:translateY(-4px);opacity:0}30%{opacity:.8}to{transform:translateY(34px);opacity:0}}
.mist{animation:mist 7s ease-in-out infinite alternate}
@keyframes mist{to{opacity:.15;transform:translateY(-3px)}}

/* things painted in HTML on top of the picture */
.wallphoto{display:flex;align-items:center;justify-content:center;background:#fff;padding:calc(var(--u)*.5)}
.wallphoto img,.thumb img{max-width:100%;max-height:100%;object-fit:contain}
.thumb{display:flex;align-items:center;justify-content:center;animation:bob 5s ease-in-out infinite alternate}
.thumb span{display:block;padding:calc(var(--u)*.45);background:#FFFDF8;box-shadow:0 calc(var(--u)*.6) calc(var(--u)*1.200) rgba(80,50,130,.3);max-height:100%}
.thumb img{max-height:calc(var(--u)*12.500)}
@keyframes bob{to{transform:translateY(calc(var(--u)*-.9)) rotate(1deg)}}
.plaque{display:flex;align-items:center;justify-content:center;font:700 calc(var(--u)*2.200) var(--hand);color:#6B4FA8}
#sign{display:flex;flex-direction:column;align-items:center;justify-content:center;border-radius:calc(var(--u)*1.200);background:linear-gradient(#F7F1FD,#E4D6F8);box-shadow:0 calc(var(--u)*.6) calc(var(--u)*2) rgba(80,50,130,.25),inset 0 0 0 calc(var(--u)*.35) #C7B3EC;animation:signsway 7s ease-in-out infinite alternate;transform-origin:50% -40%}
@keyframes signsway{from{rotate:-.6deg}to{rotate:.6deg}}
#sign b{font:700 calc(var(--u)*2.550)/1 var(--serif);letter-spacing:.06em;color:#5B3F9A;white-space:nowrap}
#sign i{margin-top:calc(var(--u)*1);font:italic 400 calc(var(--u)*1.700)/1 var(--serif);color:#7A62B0}
.yours{font:italic 500 calc(var(--u)*2.300)/1.2 var(--serif);color:#5B3F9A;text-align:center}
.pin{padding:calc(var(--u)*.8) calc(var(--u)*1);background:#FFF6C8;rotate:4deg;box-shadow:0 calc(var(--u)*.4) calc(var(--u)*.9) rgba(80,50,30,.2);font:700 calc(var(--u)*1.750)/1.05 var(--hand);color:#5A3E4B}
.pin::before{content:'';position:absolute;left:50%;top:calc(var(--u)*-.6);width:calc(var(--u)*1.200);height:calc(var(--u)*1.200);margin-left:calc(var(--u)*-.6);border-radius:50%;background:#E36B8F}
.chalk{display:flex;align-items:center;justify-content:center;padding:calc(var(--u)*1);font:700 calc(var(--u)*2.100)/1.05 var(--hand);color:#FFF6E0;text-align:center}
.tag{padding:calc(var(--u)*.6) calc(var(--u)*.8);background:#FFFDF6;rotate:-5deg;box-shadow:0 calc(var(--u)*.3) calc(var(--u)*.8) rgba(80,50,30,.2);font:700 calc(var(--u)*1.500)/1.05 var(--hand);color:#5A3E4B}
.mlabel{display:flex;align-items:center;justify-content:center;font:900 calc(var(--u)*1.200)/1 var(--ui);letter-spacing:.06em;color:#fff}
.dlabel{display:flex;align-items:center;justify-content:center;font:800 calc(var(--u)*.85)/1.05 var(--ui);letter-spacing:.04em;color:#6B4FA8;text-align:center}
#candleP{animation:float 5s ease-in-out infinite alternate}
#candleP svg{width:100%;height:100%;overflow:visible}
@keyframes float{to{transform:translateY(calc(var(--u)*-1.400))}}
.lit .cfl{display:block}
.cfl{display:none}
/* hotspots */
.spot{position:absolute;left:calc(var(--u)*var(--x));top:calc(var(--u)*var(--y));width:calc(var(--u)*var(--w));height:calc(var(--u)*var(--h));z-index:3;padding:0;border:0;border-radius:calc(var(--u)*2);background:none;transition:background .3s}
.spot:hover{background:rgba(255,255,255,.1)}
.spot::after{content:'✦';position:absolute;right:calc(var(--u)*.6);top:calc(var(--u)*.4);font-size:calc(var(--u)*2.400);color:#FFF3C4;text-shadow:0 0 calc(var(--u)*1.200) #FFD98A;animation:breathe 2.200s ease-in-out infinite}
.spot.seen::after{display:none}
#swipe{position:fixed;left:50%;bottom:max(18px,env(safe-area-inset-bottom));z-index:12;translate:-50% 0;padding:9px 16px;border-radius:999px;background:rgba(46,35,88,.75);color:#F4EEFF;font:700 13.500px/1 var(--ui);letter-spacing:.02em;white-space:nowrap;pointer-events:none;transition:opacity .8s ease;backdrop-filter:blur(6px)}
#swipe.gone{opacity:0}
.edge{position:fixed;top:50%;z-index:12;width:46px;height:46px;margin-top:-23px;border:0;border-radius:50%;background:rgba(46,35,88,.55);color:#fff;font:800 20px/1 var(--ui);backdrop-filter:blur(6px)}
#edgeL{left:10px}#edgeR{right:10px}
@media (pointer:coarse){.edge{display:none}}

/* ---------- rooms ---------- */
.room{position:fixed;inset:0;z-index:20;display:flex;flex-direction:column;align-items:center;overflow-y:auto;overscroll-behavior:contain;padding:max(62px,calc(env(safe-area-inset-top) + 50px)) 18px max(40px,env(safe-area-inset-bottom));opacity:0;transition:opacity .7s ease;-webkit-overflow-scrolling:touch}
.room.on{opacity:1}
.room .in{width:100%;max-width:820px;margin:auto}
.rtitle{font:italic 500 clamp(26px,7vw,40px)/1.1 var(--serif);text-align:center;color:#F4EEFF}
.rsub{margin-top:8px;font:600 clamp(19px,5vw,23px)/1.2 var(--hand);text-align:center;color:#D9C8FF}
.back{position:fixed;left:max(12px,env(safe-area-inset-left));top:max(12px,env(safe-area-inset-top));z-index:30;min-height:40px;padding:0 15px;border:1.200px solid rgba(233,220,255,.4);border-radius:999px;background:rgba(30,22,56,.55);color:#F4EEFF;font:700 13.500px/1 var(--ui);backdrop-filter:blur(6px)}
.light .back{background:rgba(255,255,255,.7);color:#4A3570;border-color:rgba(91,63,154,.3)}

/* memory cabinet */
#r-mem{background:radial-gradient(ellipse at 50% 30%,#4E3D85,#231A3F 75%)}
#r-mem::before{content:'';position:fixed;inset:0;background:linear-gradient(115deg,transparent 30%,rgba(255,255,255,.05) 38%,transparent 46%,transparent 60%,rgba(255,255,255,.04) 66%,transparent 72%);pointer-events:none}
/* the photos fly out of the cabinet and drift, turning slowly in the air */
#r-mem .in{margin:0 auto auto}
.mhint{margin-top:6px;font:600 clamp(18px,4.800vw,21px)/1.2 var(--hand);text-align:center;color:#CDB8F5;animation:breathe 2.600s ease-in-out infinite}
#mfloat{position:fixed;inset:0;z-index:1;perspective:900px;pointer-events:none}
.fph{position:absolute;left:0;top:0;width:var(--fw);padding:0;border:0;background:none;pointer-events:auto;will-change:transform;transform-style:preserve-3d}
.fph .card{position:relative;display:block;transform-style:preserve-3d}
.fph .face,.fph .backf{display:block;padding:5px 5px 16px;background:#FFFDF8;box-shadow:0 12px 28px rgba(10,5,30,.5),0 0 22px rgba(201,178,255,.35);backface-visibility:hidden;-webkit-backface-visibility:hidden}
.fph img{width:100%;height:auto}
.fph .backf{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:repeating-linear-gradient(45deg,#F6EEFF 0 6px,#EFE3FF 6px 12px);transform:rotateY(180deg);font:700 22px/1 var(--hand);color:#9B7FD6}
.fph .glint{position:absolute;inset:0;background:linear-gradient(115deg,transparent 30%,rgba(255,255,255,.45) 45%,transparent 60%);mix-blend-mode:screen;pointer-events:none;opacity:var(--g,0)}
.fph.caught{z-index:5}
.fph:focus-visible .face{outline:2.500px solid var(--gold);outline-offset:3px}
#zoomL{position:fixed;inset:0;z-index:35;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:58px 16px 30px;background:rgba(18,12,36,.82);opacity:0;transition:opacity .45s ease}
#zoomL.on{opacity:1}
#zoomBox{position:relative;padding:8px 8px 10px;background:#FFFDF8;box-shadow:0 20px 60px rgba(0,0,0,.5),0 0 60px rgba(201,178,255,.5)}
#zoomBox img{max-width:min(86vw,560px);max-height:62svh;width:auto;height:auto}
.spark{position:absolute;width:12px;height:12px;color:#FFF0B8;pointer-events:none;animation:sp 2.400s ease-in-out infinite}
@keyframes sp{50%{transform:scale(.4) rotate(45deg);opacity:.4}}
#zoomCap{max-width:560px;margin-top:16px;font:700 clamp(22px,5.800vw,27px)/1.15 var(--hand);color:#F4EEFF;text-align:center;opacity:0;transition:opacity .8s ease .35s}
#zoomL.on #zoomCap{opacity:1}
.close{position:fixed;right:max(12px,env(safe-area-inset-right));top:max(12px,env(safe-area-inset-top));z-index:36;width:44px;height:44px;border:0;border-radius:50%;background:#F4EEFF;color:#3B2C55;font:700 22px/1 var(--ui)}

/* mailbox */
#r-mail{background:radial-gradient(ellipse at 50% 0,#6A4FB0,#2B2050 70%)}
.mbig{width:120px;margin:0 auto;filter:drop-shadow(0 10px 24px rgba(0,0,0,.4))}
.mbig svg{display:block;width:100%}
.mbig .lid{transform-box:fill-box;transform-origin:50% 100%;transition:transform 1s cubic-bezier(.3,1.300,.5,1) .2s}
#r-mail.on .mbig .lid{transform:rotateX(70deg)}
.envs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px 12px;margin-top:22px}
.env{position:relative;min-height:84px;padding:14px 12px 12px;border:0;border-radius:6px;background:linear-gradient(#FBF6FF,#E9DCFB);box-shadow:0 8px 18px rgba(10,5,30,.35);color:#4A3570;font:700 clamp(18px,4.800vw,21px)/1.05 var(--hand);text-align:left;rotate:var(--r);transition:transform .25s ease}
.env::before{content:'';position:absolute;left:0;right:0;top:0;height:28px;background:linear-gradient(160deg,#D9C8FF 50%,transparent 50.500%),linear-gradient(200deg,#D9C8FF 50%,transparent 50.500%);background-size:50% 100%;background-repeat:no-repeat;background-position:left top,right top;opacity:.75;border-radius:6px 6px 0 0}
.env span{position:relative;display:block;margin-top:16px}
.env::after{content:'';position:absolute;right:10px;bottom:10px;width:12px;height:12px;border-radius:50%;background:#E36B8F;box-shadow:0 0 0 3px rgba(227,107,143,.25)}
.env:hover{transform:translateY(-3px)}
.env.read{opacity:.75}
.foot{margin-top:24px;font:600 clamp(21px,5.500vw,25px)/1.2 var(--hand);text-align:center;color:#E9DCFF}
#paper{position:fixed;inset:0;z-index:35;display:flex;align-items:center;justify-content:center;padding:24px 18px;background:rgba(18,12,36,.78);opacity:0;transition:opacity .4s ease}
#paper.on{opacity:1}
#paperIn{width:min(100%,440px);padding:30px 26px 34px;border-radius:3px;background:repeating-linear-gradient(transparent 0 31px,rgba(170,140,220,.25) 31px 32px),#FFFDF8;background-position:0 14px;box-shadow:0 20px 60px rgba(0,0,0,.5);color:#3B2C55;transform:translateY(30px) scale(.94);transition:transform .7s cubic-bezier(.3,1.300,.5,1)}
#paper.on #paperIn{transform:none}
#paperTo{font:800 12.500px/1.2 var(--ui);letter-spacing:.14em;text-transform:uppercase;color:#8C6CC4}
#paperText{margin-top:10px;font:600 clamp(24px,6.300vw,28px)/32px var(--hand)}

/* potions */
#r-pot{background:linear-gradient(#3A2B6B,#241A45)}
.pgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;margin-top:20px}
.pot{position:relative;display:flex;flex-direction:column;align-items:center;padding:12px 6px 14px;border:0;border-radius:18px;background:rgba(255,255,255,.04);transition:background .4s}
.pot::after{content:'';position:absolute;left:8%;right:8%;bottom:56px;height:5px;border-radius:3px;background:#B39BE0;opacity:.6}
.pot svg{width:96px;height:120px;overflow:visible;transition:transform .5s cubic-bezier(.3,1.600,.5,1),filter .5s}
.pot.on{background:rgba(255,255,255,.1)}
.pot.on svg{transform:scale(1.12) rotate(-3deg);filter:drop-shadow(0 0 18px var(--c)) drop-shadow(0 0 6px var(--c))}
.plabel{position:relative;z-index:1;margin-top:6px;padding:6px 10px;border-radius:6px;background:#FFF6E4;color:#4A3570;font:900 12.500px/1.15 var(--ui);letter-spacing:.06em;box-shadow:0 4px 10px rgba(0,0,0,.25);transition:transform .45s cubic-bezier(.3,1.500,.5,1)}
.pot.on .plabel{transform:scale(1.08)}
.pline{max-height:0;overflow:hidden;margin-top:0;font:600 18px/1.15 var(--hand);color:#FFF0C8;transition:max-height .6s ease,margin .6s ease}
.pot.on .pline{max-height:90px;margin-top:8px}
.bubble{position:absolute;width:8px;height:8px;border-radius:50%;background:var(--c);box-shadow:0 0 8px var(--c);pointer-events:none;animation:rise 1.400s ease-out forwards}
@keyframes rise{to{transform:translate(var(--dx),-120px) scale(.3);opacity:0}}

/* drawer */
#r-drawer{background:radial-gradient(ellipse at 50% 20%,#5A4398,#241A45 75%)}
.dfront{width:min(100%,520px);margin:18px auto 0;padding:14px;border-radius:10px;background:linear-gradient(#EADFFA,#C9B6E8);box-shadow:0 14px 34px rgba(0,0,0,.35);text-align:center;color:#5B3F9A;font:900 13px/1.25 var(--ui);letter-spacing:.08em;transform:perspective(600px) rotateX(18deg);transition:transform 1.200s cubic-bezier(.3,1.200,.5,1)}
#r-drawer.on .dfront{transform:perspective(600px) translateY(-8px) rotateX(0)}
.dfront i{display:block;width:60px;height:10px;margin:10px auto 0;border-radius:5px;background:#C9A86B}
.velvet{width:min(100%,520px);margin:0 auto;padding:18px 14px;border-radius:0 0 12px 12px;background:radial-gradient(ellipse at 50% 0,#6E54B0,#4A3585);box-shadow:inset 0 10px 24px rgba(0,0,0,.35);display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px;clip-path:inset(0 0 100% 0);transition:clip-path 1.300s cubic-bezier(.3,.8,.3,1) .4s}
#r-drawer.on .velvet{clip-path:inset(0 0 0 0)}
.obj{aspect-ratio:1;padding:4px;border:0;border-radius:12px;background:rgba(255,255,255,.08);transition:transform .3s cubic-bezier(.3,1.600,.5,1),background .3s}
.obj svg{width:100%;height:100%;filter:drop-shadow(0 4px 6px rgba(0,0,0,.3))}
.obj:hover,.obj.on{transform:translateY(-4px) scale(1.06);background:rgba(255,255,255,.18)}
.obj.seen{background:rgba(255,230,170,.16)}
#dnote{min-height:96px;width:min(100%,520px);margin:18px auto 0;padding:14px 18px;border-radius:4px;background:#FFF6C8;color:#4A3448;font:700 clamp(22px,5.800vw,26px)/1.15 var(--hand);text-align:center;rotate:-1deg;box-shadow:0 8px 20px rgba(0,0,0,.3);transition:opacity .3s}
#dnote.empty{opacity:.0}

/* observatory */
#r-sky{padding:0;background:radial-gradient(ellipse at 50% 110%,#7A5CC4,#2E2358 45%,#140E2A)}
#skyC{position:fixed;inset:0}
.wish{position:fixed;z-index:2;width:46px;height:46px;margin:-23px 0 0 -23px;padding:0;border:0;background:none}

#r-out{justify-content:center;background:linear-gradient(#1E1638,#3A2B6B 65%,#5A4390)}

#snd{position:fixed;right:max(12px,env(safe-area-inset-right));top:max(12px,env(safe-area-inset-top));z-index:45;display:flex;align-items:center;justify-content:center;gap:2px;width:40px;height:40px;padding:0;border:1.200px solid rgba(233,220,255,.4);border-radius:50%;background:rgba(30,22,56,.6);color:#fff;backdrop-filter:blur(6px)}

@media (min-width:760px){

}

<script src="shop.js"></script>
<script src="art.js"></script>
<script>
/* =====================================================================
   DAY 32 SETTINGS.

   DAY32_PASSWORD: leave empty and the first screen is just the door.
   Put a word here and a small box appears above the door.

   MUSIC: drop a song named song.mp3 in this folder. It starts when he
   opens the door, goes quiet in the warm corner, stops for the secret
   room and the cake video, and comes back afterwards.

   WORDS and PHOTOS: shop.js. DRAWINGS: art.js. VIDEO: video.mp4.
   ===================================================================== */
const DAY32_PASSWORD = '';

(() => {
const D = window.DAY32, A = window.ART;
const $ = s => document.querySelector(s);
const RM = matchMedia('(prefers-reduced-motion: reduce)').matches;
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const sleep = ms => new Promise(r => setTimeout(r, RM ? Math.min(ms, 350) : ms));
const norm = s => s.trim().toLowerCase();

/* =========================== sound =========================== */
let ac = null, master = null, soundOn = true;
function audio() {
  if (ac) return;
  try { ac = new (window.AudioContext || window.webkitAudioContext)(); master = ac.createGain(); master.gain.value = .16; master.connect(ac.destination); } catch (e) { ac = null; }
}
function tone(f, t0, dur, type = 'sine', vol = .5) {
  if (!ac || !soundOn) return;
  const o = ac.createOscillator(), g = ac.createGain(); o.type = type; o.frequency.value = f;
  g.gain.setValueAtTime(0, ac.currentTime + t0); g.gain.linearRampToValueAtTime(vol, ac.currentTime + t0 + .01); g.gain.exponentialRampToValueAtTime(.0001, ac.currentTime + t0 + dur);
  o.connect(g); g.connect(master); o.start(ac.currentTime + t0); o.stop(ac.currentTime + t0 + dur + .05);
}
function noise(dur, freq, vol = .4, q = 1) {
  if (!ac || !soundOn) return;
  const n = ac.createBuffer(1, ac.sampleRate * dur, ac.sampleRate), d = n.getChannelData(0);
  for (let i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / d.length);
  const s = ac.createBufferSource(), f = ac.createBiquadFilter(), g = ac.createGain(); s.buffer = n; f.type = 'bandpass'; f.frequency.value = freq; f.Q.value = q; g.gain.value = vol;
  s.connect(f); f.connect(g); g.connect(master); s.start();
}
const SFX = {
  chime: () => [1047, 1319, 1568].forEach((f, i) => tone(f, i * .07, 1.200, 'sine', .32)),
  sparkle: () => { for (let i = 0; i < 6; i++) tone(1800 + Math.random() * 1600, i * .045, .35, 'sine', .14); },
  bell: () => { tone(880, 0, 2.400, 'sine', .4); tone(1760, 0, 1.600, 'sine', .14); tone(2640, 0, .9, 'sine', .06); },
  paper: () => noise(.25, 3000, .35, .7),
  drawer: () => { noise(.55, 400, .5, .8); tone(196, .45, .3, 'triangle', .2); },
  door: () => { noise(1.200, 260, .4, 2); tone(523, .9, 1.400, 'sine', .2); tone(784, 1.050, 1.400, 'sine', .16); },
  whoosh: () => noise(.8, 900, .35, .5),
  candle: () => { noise(.35, 1200, .3, .6); [784, 988, 1175, 1568].forEach((f, i) => tone(f, .2 + i * .09, 1.500, 'sine', .22)); },
};
const sfx = k => { try { SFX[k] && SFX[k](); } catch (e) {} };

/* background song (optional) */
const song = $('#song');
let songOk = true, songWant = false, fade = 0, songTarget = .5;
song.addEventListener('error', () => { songOk = false; });
function songTo(v, ms = 1500) {
  songTarget = v; if (!songOk) return;
  clearInterval(fade);
  if (v > 0 && vidPlaying) return;
  if (v > 0 && soundOn && song.paused) { song.volume = 0; song.play().catch(() => {}); }
  const from = song.volume, t0 = Date.now();
  fade = setInterval(() => { const p = Math.min(1, (Date.now() - t0) / ms); song.volume = Math.max(0, Math.min(1, from + (v - from) * p)); if (p >= 1) { clearInterval(fade); if (v === 0) song.pause(); } }, 60);
}
const snd = $('#snd');
function drawSnd() { snd.classList.toggle('on', soundOn); snd.setAttribute('aria-pressed', String(soundOn)); snd.setAttribute('aria-label', soundOn ? 'Sound on. Tap to mute' : 'Sound off. Tap to turn on'); }
snd.addEventListener('click', () => {
  soundOn = !soundOn; drawSnd();
  if (!soundOn) { clearInterval(fade); song.pause(); } else if (songWant && songTarget > 0) songTo(songTarget, 800);
  if (master) master.gain.value = soundOn ? .16 : 0;
});
document.addEventListener('visibilitychange', () => { if (document.hidden) song.pause(); else if (soundOn && songWant && songTarget > 0 && songOk && !vidPlaying) song.play().catch(() => {}); });

/* =========================== floating dust =========================== */
const dust = $('#dust'), dx = dust.getContext('2d');
let DW = 0, DH = 0, motes = [], dustSpeed = 1, dustOn = true;
function sizeDust() { const r = Math.min(devicePixelRatio || 1, 2); DW = innerWidth; DH = innerHeight; dust.width = DW * r; dust.height = DH * r; dx.setTransform(r, 0, 0, r, 0, 0); const n = Math.round(Math.min(60, DW * DH / 16000)); while (motes.length < n) motes.push(newMote(true)); motes.length = n; }
function newMote(any) { return { x: Math.random() * DW, y: any ? Math.random() * DH : DH + 10, r: .6 + Math.random() * 1.800, v: .12 + Math.random() * .35, ph: Math.random() * 6.28, c: Math.random() < .5 ? '255,240,200' : '225,210,255' }; }
let trail = null, lastT = 0;
function drawDust(t) {
  requestAnimationFrame(drawDust);
  if (!dustOn || RM) { dx.clearRect(0, 0, DW, DH); return; }
  const dt = Math.min(50, t - lastT) / 16.7; lastT = t;
  dx.clearRect(0, 0, DW, DH);
  for (const m of motes) {
    m.y -= m.v * dt * dustSpeed; m.x += Math.sin(t / 1800 + m.ph) * .25 * dustSpeed; m.ph += .002;
    if (m.y < -10) Object.assign(m, newMote(false));
    const a = .35 + .35 * Math.sin(t / 900 + m.ph);
    dx.fillStyle = `rgba(${m.c},${a})`; dx.beginPath(); dx.arc(m.x, m.y, m.r, 0, 6.283); dx.fill();
  }
  /* now and then a little trail of magic dust passes through */
  if (!trail && Math.random() < .0016 * dustSpeed) trail = { x: -40, y: DH * (.2 + Math.random() * .5), vx: 3 + Math.random() * 2, vy: -.6 + Math.random() * 1.200, pts: [] };
  if (trail) {
    trail.x += trail.vx * dt; trail.y += trail.vy * dt + Math.sin(trail.x / 60) * .8;
    trail.pts.push({ x: trail.x, y: trail.y, l: 1 });
    for (const p of trail.pts) { p.l -= .018 * dt; if (p.l > 0) { dx.fillStyle = `rgba(255,236,190,${p.l * .8})`; dx.beginPath(); dx.arc(p.x + (Math.random() - .5) * 3, p.y + (Math.random() - .5) * 3, 1.400 * p.l + .3, 0, 6.283); dx.fill(); } }
    trail.pts = trail.pts.filter(p => p.l > 0);
    if (trail.x > DW + 60 && !trail.pts.length) trail = null;
  }
}
addEventListener('resize', sizeDust); sizeDust(); requestAnimationFrame(drawDust);

/* =========================== 1. the door =========================== */
const O = D.opening;
$('#oDate').textContent = O.date; $('#oDoorT').textContent = O.door; $('#oL1').textContent = O.lines[0]; $('#oL2').textContent = O.lines[1]; $('#oHint').textContent = O.hint;
if (DAY32_PASSWORD) { $('#pw').hidden = false; $('#pwMsg').hidden = false; }
(async () => {
  await sleep(700); $('#oDate').classList.add('on');
  await sleep(1300); $('#oDoorT').classList.add('on');
  await sleep(1900); $('#oL1').classList.add('on');
  await sleep(2400); $('#oL2').classList.add('on');
  await sleep(1300); $('#door').classList.add('on'); $('#oHint').classList.add('on');
})();
let entered = false;
$('#door').addEventListener('click', async () => {
  if (entered) return;
  if (DAY32_PASSWORD && norm($('#pass').value) !== norm(DAY32_PASSWORD)) { $('#pwMsg').textContent = $('#pass').value.trim() ? 'hmm, that’s not it, Ammu. try again? 🥹' : 'you have to type something first, bro. 😭'; $('#pass').focus(); return; }
  entered = true;
  audio(); if (ac && ac.state === 'suspended') ac.resume();
  songWant = true; songTo(.5, 3000);                // inside the tap, so the phone allows sound
  sfx('door');
  $('#door').classList.add('opening'); dustSpeed = 3;
  await sleep(1500);
  $('#flood').classList.add('on');
  await sleep(1100);
  buildShop();
  $('#open').classList.add('gone'); snd.hidden = false; drawSnd();
  await sleep(200);
  $('#flood').classList.remove('on'); dustSpeed = 1;
  setTimeout(() => { $('#open').hidden = true; }, 1300);
});

/* =========================== 2. the shop =========================== */
const S = D.shop, shop = $('#shop'), pano = $('#pano');
const seen = new Set();
const at = (x, y, w, h) => `--x:${x};--y:${y};--w:${w};--h:${h}`;
const CANDLE = (big = false) => `<svg viewBox="-12 -16 24 44"><defs><linearGradient id="cw${big ? 2 : 1}" x1="0" x2="1"><stop offset="0" stop-color="#F4ECFF"/><stop offset=".5" stop-color="#FFFFFF"/><stop offset="1" stop-color="#D9C8FF"/></linearGradient><radialGradient id="cg${big ? 2 : 1}"><stop offset="0" stop-color="#FFE6A8" stop-opacity=".95"/><stop offset=".4" stop-color="#FFC77A" stop-opacity=".35"/><stop offset="1" stop-color="#FFC77A" stop-opacity="0"/></radialGradient></defs>
  <g class="cfl"><circle class="halo" cx="0" cy="-6" r="16" fill="url(#cg${big ? 2 : 1})"/><path class="flick" d="M0-14C3-9 3.400-6 0-3.600-3.400-6-3-9 0-14Z" fill="#FFD27A"/><path d="M0-10C1.300-7.600 1.400-6 0-4.800-1.400-6-1.300-7.600 0-10Z" fill="#FFF6D8"/></g>
  <path d="M0 0v-3.600" stroke="#4C3F6B" stroke-width=".8"/><rect x="-6" y="0" width="12" height="26" rx="2" fill="url(#cw${big ? 2 : 1})"/><path d="M-6 2c2 2 3 0 4 3s2 1 3-1 3 3 5-1" stroke="#E9DCFF" stroke-width="1.400" fill="none"/>
  <text x="0" y="17" text-anchor="middle" font-family="Fraunces,Georgia,serif" font-weight="800" font-size="8" fill="#8C6CC4">32</text><ellipse cx="0" cy="27" rx="9" ry="2" fill="#2A1E4A" opacity=".18"/></svg>`;
let built = false;
function buildShop() {
  if (built) { shop.hidden = false; return; }
  built = true;
  const M = D.memories.photos;
  let h = A.shop();
  h += `<div class="at wallphoto" style="${at(47, 20, 11, 14)}"><img src="${D.warm.photo}" alt=""></div>`;
  [[0, 67.500, 23], [1, 79, 23], [2, 90.500, 23], [3, 67.500, 41], [4, 79, 41], [5, 90.500, 41], [6, 67.500, 61], [8, 79, 61], [11, 90.500, 61]].forEach(([i, x, y], k) =>
    h += `<div class="at thumb" style="${at(x, y, 10, 13.500)};animation-delay:${-k * .7}s"><span><img src="${M[i].src}" alt="" loading="lazy"></span></div>`);
  h += `<p class="at plaque" style="${at(76, 11, 16, 3.600)}">memories</p>`;
  h += `<div class="at" id="sign" style="${at(163, 9.500, 42, 11)}"><b>${esc(S.name)}</b><i>${esc(S.sub)}</i></div>`;
  h += `<p class="at yours" style="${at(160, 23, 48, 3)}">${esc(S.yours)}</p>`;
  h += `<p class="at pin" style="${at(199, 27.500, 13.500, 8)}">${S.note.map(esc).join('<br>')}</p>`;
  h += `<p class="at chalk" style="${at(139.500, 63, 16, 11)}">${esc(S.look)}</p>`;
  h += `<div class="at" id="candleP" style="${at(177, 27, 14, 32)}">${CANDLE()}</div>`;
  h += `<p class="at tag" style="${at(192, 49, 15, 6)}">${esc(D.candle.missing)}</p>`;
  h += `<p class="at mlabel" style="${at(159, 51.300, 10, 1.600)}">${esc(D.letters.label)}</p>`;
  h += `<p class="at dlabel" style="${at(178, 68.200, 14, 3)}">${esc(D.drawer.label.toLowerCase())} ♡</p>`;
  h += `<p class="at plaque" style="${at(252.500, 24, 18, 5)}">${esc(D.observatory.stairs)}</p>`;
  const spots = [['warm', 'The warm corner', 3, 14, 56, 68], ['mem', 'The memory cabinet', 62, 8, 44, 74], ['pot', 'The potion shelf', 108, 22, 44, 38], ['mail', 'The mailbox: for Arjun', 156, 44, 16, 19],
    ['candle', 'The candle of 32', 174, 26, 20, 33], ['drawer', 'The drawer: things I never want to stop doing', 172, 64, 26, 15], ['mirror', 'The mirror', 219, 12, 30, 70], ['sky', 'The stairs to the observatory', 251, 0, 52, 82]];
  h += spots.map(([id, label, x, y, w, hh]) => `<button class="spot" type="button" data-room="${id}" aria-label="${esc(label)}" style="${at(x, y, w, hh)}"></button>`).join('');
  pano.innerHTML = h;
  pano.querySelectorAll('.spot').forEach(b => b.addEventListener('click', () => openRoom(b.dataset.room, b)));
  shop.hidden = false;
  /* start looking at the counter */
  requestAnimationFrame(() => { const u = pano.offsetHeight / 100; shop.scrollLeft = 184 * u - innerWidth / 2; });
  const sw = $('#swipe'); sw.textContent = S.swipe; sw.hidden = false;
  let moved = 0; shop.addEventListener('scroll', () => { if (++moved > 6) sw.classList.add('gone'); }, { passive: true });
  if (!matchMedia('(pointer:coarse)').matches) { $('#edgeL').hidden = false; $('#edgeR').hidden = false; }
}
$('#edgeL').addEventListener('click', () => shop.scrollBy({ left: -innerWidth * .6, behavior: RM ? 'auto' : 'smooth' }));
$('#edgeR').addEventListener('click', () => shop.scrollBy({ left: innerWidth * .6, behavior: RM ? 'auto' : 'smooth' }));
shop.addEventListener('wheel', e => { if (Math.abs(e.deltaY) > Math.abs(e.deltaX)) { shop.scrollLeft += e.deltaY; e.preventDefault(); } }, { passive: false });

/* =========================== rooms: opening and closing =========================== */
let current = null, fromBtn = null;
const ROOMS = { mem: '#r-mem', mail: '#r-mail', pot: '#r-pot', drawer: '#r-drawer', sky: '#r-sky', warm: '#r-warm', mirror: '#r-mirror', candle: '#r-candle' };
function show(sel) { const r = $(sel); r.hidden = false; r.scrollTop = 0; void r.offsetWidth; r.classList.add('on'); return r; }
function hide(sel, ms = 700) { const r = $(sel); r.classList.remove('on'); setTimeout(() => { if (!r.classList.contains('on')) r.hidden = true; }, RM ? 0 : ms); }
document.querySelectorAll('.room .back').forEach(b => { b.textContent = S.back; b.addEventListener('click', closeRoom); });
function openRoom(id, btn) {
  if (current) return;
  current = id; fromBtn = btn;
  sfx(id === 'drawer' ? 'drawer' : id === 'mail' ? 'paper' : id === 'sky' ? 'whoosh' : 'chime');
  const r = show(ROOMS[id]);
  ENTER[id] && ENTER[id]();
  const f = r.querySelector('.back'); f && f.focus({ preventScroll: true });
}
function closeRoom() {
  if (!current) return;
  const id = current; current = null;
  LEAVE[id] && LEAVE[id]();
  hide(ROOMS[id]);
  seen.add(id); fromBtn && fromBtn.classList.add('seen');
  fromBtn && fromBtn.focus({ preventScroll: true });
}
addEventListener('keydown', e => {
  if (e.key !== 'Escape') return;
  if (!$('#zoomL').hidden) return closeZoom();
  if (!$('#paper').hidden) return closePaper();
  if (current && current !== 'candle') closeRoom();
});
const ENTER = {}, LEAVE = {};

/* ---------- memory cabinet ---------- */
$('#memT').textContent = D.memories.title;
$('#memHint').textContent = D.memories.hint;
const mf = $('#mfloat');
mf.innerHTML = D.memories.photos.map((p, i) => `<button class="fph" type="button" data-i="${i}" aria-label="Catch this memory"><span class="card"><span class="face"><img src="${p.src}" alt="a photo of us"></span><span class="backf" aria-hidden="true">♡</span><span class="glint"></span></span></button>`).join('');
const fl = [...mf.children].map((el, i) => ({ el, i, ph: Math.random() * 6.28, fx: .07 + Math.random() * .06, fy: .09 + Math.random() * .07, px: Math.random() * 6.28, py: Math.random() * 6.28, spin: (i % 2 ? 1 : -1) * (18 + Math.random() * 26), rot: Math.random() * 360, tilt: (Math.random() - .5) * 18, z: .78 + (i % 4) * .1, caught: false, w: 0, h: 0 }));
let flRun = 0, flT0 = 0;
function flSize() {
  const fw = Math.round(Math.min(innerWidth * (innerWidth < 600 ? .3 : .17), 170));
  mf.style.setProperty('--fw', fw + 'px');
  fl.forEach(f => { f.w = fw; f.h = f.el.offsetHeight || fw * 1.2; });
}
function flPos(f, t) {
  /* each photo drifts on its own slow loop around the room */
  const top = innerWidth < 600 ? 120 : 110, W = innerWidth, H = innerHeight;

  lp.innerHTML = K.letter.map(b => b.b ? `<p class="ln lb">${esc(b.b)}</p>` : b.p ? `<p class="ln lp">${esc(b.p)}</p>` : b.big ? `<p class="ln lbig">${esc(b.big)}</p>` : `<div class="ln llist">${b.list.map(x => `<span>${esc(x)}</span>`).join('')}</div>`).join('') + `<button id="lnext" type="button" aria-label="Keep going">→</button>`;
  const lt = $('#letter'); lt.hidden = false; lt.scrollTop = 0; requestAnimationFrame(() => lt.classList.add('on'));
  const ls = [...lp.querySelectorAll('.ln')];
  for (let i = 0; i < ls.length; i++) {
    ls[i].classList.add('on');
    if (ls[i].getBoundingClientRect().bottom > innerHeight - 30) ls[i].scrollIntoView({ block: 'end', behavior: RM ? 'auto' : 'smooth' });
    await sleep(ls[i].classList.contains('lbig') ? 2200 : ls[i].classList.contains('llist') ? 1600 : 1000);
  }
  const n = $('#lnext'); n.classList.add('on'); n.scrollIntoView({ block: 'end', behavior: RM ? 'auto' : 'smooth' });
  n.addEventListener('click', toBut); n.focus({ preventScroll: true });
});

/* =========================== but bro… the birthday room =========================== */
async function toBut() {
  const lt = $('#letter'); lt.classList.remove('on'); setTimeout(() => { lt.hidden = true; }, 600);
  hide('#r-keeper'); await sleep(700);
  show('#r-but'); $('#but1').textContent = K.but; $('#but2').textContent = K.missing; $('#bdoorT').textContent = D.birthday.door;
  await sleep(900); $('#but1').classList.add('on');
  await sleep(2200); $('#but2').classList.add('on');
  await sleep(2400); sfx('bell');
  await sleep(900); $('#bdoor').classList.add('on'); $('#bdoorT').classList.add('on'); $('#bdoor').focus({ preventScroll: true });
}
$('#bdoor').addEventListener('click', async () => {
  const d = $('#bdoor'); if (d.classList.contains('open')) return;
  d.classList.add('open'); sfx('door');
  await sleep(1400);
  $('#r-but').style.background = '#FFF4E0';
  hide('#r-but', 1000); await sleep(600);
  $('#bcake').innerHTML = A.cake(); show('#r-bday');
  $('#bl1').textContent = D.birthday.lines[0]; $('#bl2').textContent = D.birthday.lines[1]; $('#cut').textContent = D.birthday.cut;
  await sleep(1400); $('#bl1').classList.add('on'); sfx('chime');
  await sleep(1600); $('#bl2').classList.add('on');
  await sleep(1400); $('#cut').classList.add('on'); $('#cut').focus({ preventScroll: true });
});
/* the cake video */
const vid = $('#vid'); let vidPlaying = false;
$('#cut').addEventListener('click', async () => {
  vid.muted = false; vid.play().then(() => { vid.pause(); vid.currentTime = 0; }).catch(() => {});   /* unlock it inside the tap */
  songTo(0, 1200);
  hide('#r-bday', 900); await sleep(700);
  show('#r-video'); $('#vtitle').textContent = D.birthday.title;
  await sleep(2200);
  $('#vframe').classList.add('on');
  await sleep(900);
  vid.currentTime = 0; vid.play().then(() => { vidPlaying = true; }).catch(() => { $('#vplay').hidden = false; });
  $('#vbig').textContent = D.birthday.bigger; $('#vbig').hidden = false;
});
$('#vbig').addEventListener('click', () => {
  const f = vid.requestFullscreen ? vid.requestFullscreen() : vid.webkitEnterFullscreen ? vid.webkitEnterFullscreen() : null;
  if (f && f.then) f.then(() => { try { screen.orientation.lock('landscape').catch(() => {}); } catch (e) {} }).catch(() => {});
});
document.addEventListener('fullscreenchange', () => { if (!document.fullscreenElement) { try { screen.orientation.unlock(); } catch (e) {} } });
$('#vplay').addEventListener('click', () => { $('#vplay').hidden = true; vid.play().then(() => { vidPlaying = true; }).catch(() => {}); });
vid.addEventListener('click', () => { if (vid.paused) vid.play(); else vid.pause(); });
vid.addEventListener('ended', afterVideo);
/* the video has its own sound: the song always stops the moment it plays, and stays off until it ends */
vid.addEventListener('play', () => { vidPlaying = true; clearInterval(fade); songTarget = 0; song.pause(); });
vid.addEventListener('ended', () => { vidPlaying = false; });
/* some phones never send "ended" if the last fraction of a second stalls, so this catches it too */
vid.addEventListener('timeupdate', () => { if (vid.duration && vid.currentTime >= vid.duration - .3) setTimeout(() => { if (!afterRan && vid.currentTime >= vid.duration - .3) { vidPlaying = false; afterVideo(); } }, 700); });

/* =========================== after =========================== */
let afterRan = false;
async function afterVideo() {
  if (afterRan) return; afterRan = true; vidPlaying = false;
  await sleep(3000);   /* a few seconds of quiet */
  hide('#r-video', 1000); await sleep(900);
  const B = D.birthday, a = $('#afterIn');
  a.innerHTML = B.after.map(l => `<p>${esc(l)}</p>`).join('') + `<p class="stuck">${esc(B.stuck)}</p><p class="cb">${esc(B.comeBack)}</p><p class="op">${esc(B.open)}</p>`;
  show('#r-after'); if (songWant) songTo(.45, 3000);
  const ps = [...a.children], gaps = [2200, 1800, 1600, 3400, 2600, 2000, 2600];
  for (let i = 0; i < ps.length; i++) { ps[i].classList.add('on'); if (i === 4) sfx('sparkle'); await sleep(gaps[i]); }
  /* the shop from outside */
  hide('#r-after', 1000); await sleep(900);
  $('#ostage').innerHTML = A.outside() + `<p class="oname">${esc(D.outside.name)}</p>`; $('#osub').textContent = D.outside.sub;
  show('#r-out'); await sleep(900); $('#r-out').classList.add('closed'); sfx('door');
  await sleep(6500);
  const f = $('#r-final'); $('#finalT').textContent = D.outside.final; $('#finalD').textContent = D.outside.date; $('#again').textContent = D.outside.again;
  hide('#r-out', 2000); await sleep(1200); show('#r-final'); sfx('chime');
}
$('#again').addEventListener('click', () => {
  hide('#r-final', 900);
  $('#r-out').classList.remove('closed');
  shop.hidden = false; shop.style.opacity = '1'; $('#bigCandle').classList.add('lit');
  afterRan = false;
});
})();
</script>
